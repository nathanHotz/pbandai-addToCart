# Builds the desktop app for each OS. Each build bundles the Chromium for its own platform, so
# every platform has to be built on that platform. Run it from the Actions tab for a test build;
# the Release workflow also calls it to build the binaries it publishes.
name: Build app

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version to stamp into the build (e.g. 1.2.3)
        type: string
        required: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # When releasing, stamp the release version into package.json so the installer file
      # names match the release.
      - if: inputs.version != ''
        shell: bash
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # no signing certificate — build unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: P-Bandai-Watcher-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error

  # Only on a v* tag: gather every platform's build and publish them as a GitHub release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
