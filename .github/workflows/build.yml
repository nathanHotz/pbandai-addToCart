# Builds the desktop app for each OS. Each build bundles the Chromium for its own platform, so
# every platform has to be built on that platform. Run it from the Actions tab, or push a v* tag.
name: Build app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # On a tag build, stamp the tag's version (v1.2.3 -> 1.2.3) into package.json so the
      # installer file names match the release.
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # no signing certificate — build unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: P-Bandai-Watcher-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error

  # Only on a v* tag: gather every platform's build and publish them as a GitHub release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
